<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="style.css">

<body>
    <img width="200" src="image1.png" alt="Train image">
    <table>
        <caption>Students Details</caption>
        <tr>
            <th>Name</th>
            <th>Class</th>
            <th>Age</th>
        </tr>
        <tr>
            <td>Ahmad</td>
            <td rowspan="2">10th</td>
            <td>17</td>
        </tr>
        <tr>
            <td>Ali</td>
            <td>16</td>
        </tr>

    </table>

    <ul type="circle">
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ul>

    <ol type="a">
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>
    <ol type="1">
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>
</body>

</html>
