<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<link rel="stylesheet" href="style.css">

<body>
    <!--form -->
    <form action="post">
        <div class="data">
            <label for="ripe">Enter your name</label>
            <br>
            <input type="text" name="full" id="ripe" placeholder="Enter your  name">
        </div>
        <div class="gender">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="male" value="male">
            <label for="female">Female</label>
            <input type="radio" name="gender" id="female" value="female">
        </div>
        <div class="check">
            <input type="checkbox" name="box" id="check" value="yes">
            <label for="check">Subscribe</label>
        </div>
        <div class="comment">
            <label for="good">Comment</label>
            <br>
            <textarea name="comment" id="good" rows="4" cols="30"></textarea>
        </div>
        <div class="select">
            <select name="fruits" id="Apple">
                <option value="apple">Apple</option>
                <option value="cherry">Cherry</option>
                <option value="banana">Banana</option>
            </select>
        </div>
    </form>
</body>

</html>
